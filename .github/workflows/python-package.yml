name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install UV package manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Type check with mypy
      run: |
        mypy agent/

    - name: Check py.typed marker
      run: |
        python -c "
        import pathlib, agent
        marker = pathlib.Path(agent.__file__).parent / 'py.typed'
        assert marker.exists(), 'py.typed marker missing from installed package'
        print('✅ py.typed present')
        "

    - name: Test package installation
      run: |
        python -c "from agent import ClickHouseAgent, ClickHouseConfig, MCPConnectionError, AgentExecutionError, RunResult; print('✅ Package imports successfully')"

    - name: Run tests
      run: |
        pytest tests/ -v

  live-clickhouse:
    name: Live tests (real ClickHouse)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWORD: test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user test --password test --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLICKHOUSE_LIVE_TESTS: "1"
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install UV package manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Seed ClickHouse
      run: |
        python tests/fixtures/seed_live.py

    - name: Run live tests
      run: |
        pytest tests/test_clickhouse_live.py -v

  package-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install UV package manager
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Test package build
      run: |
        uv build
        ls -la dist/

    - name: Test package installation from wheel
      run: |
        uv pip install --system dist/*.whl
        python -c "from agent import ClickHouseAgent; print('✅ Wheel installation successful')"
